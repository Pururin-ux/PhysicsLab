<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1620" viewBox="0 0 1080 1620">
  <rect x="125" y="170" width="470" height="62" rx="18" transform="rotate(-2 360 201)" fill="#ebc74a" opacity="0.9"/>
  <text transform="rotate(0 145 220)" x="145" y="220" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="900" fill="#211f1b" paint-order="stroke fill" stroke="#fffaf0" stroke-width="1.5" stroke-linejoin="round"><tspan x="145" dy="0">разбор без паники</tspan></text>

  <text transform="rotate(0 125 330)" x="125" y="330" font-family="Segoe UI, Arial, sans-serif" font-size="82" font-weight="950" fill="#211f1b" paint-order="stroke fill" stroke="#fffaf0" stroke-width="2.87" stroke-linejoin="round"><tspan x="125" dy="0">Минус в</tspan><tspan x="125" dy="83.64">ускорении</tspan><tspan x="125" dy="83.64">не ошибка</tspan></text>
  <text transform="rotate(0 132 590)" x="132" y="590" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="750" fill="#6b625a" paint-order="stroke fill" stroke="#fffaf0" stroke-width="1.5" stroke-linejoin="round"><tspan x="132" dy="0">это направление относительно</tspan><tspan x="132" dy="40.12">выбранной оси</tspan></text>

  <rect x="130" y="725" width="640" height="64" rx="18" transform="rotate(-1.5 450 757)" fill="#d9d4ed" opacity="0.9"/>
  <text transform="rotate(0 155 773)" x="155" y="773" font-family="Segoe UI, Arial, sans-serif" font-size="38" font-weight="950" fill="#211f1b" paint-order="stroke fill" stroke="#fffaf0" stroke-width="1.5" stroke-linejoin="round"><tspan x="155" dy="0">если тело тормозит</tspan></text>
  <text transform="rotate(0 150 860)" x="150" y="860" font-family="Consolas, JetBrains Mono, monospace" font-size="34" font-weight="850" fill="#211f1b" paint-order="stroke fill" stroke="#fffaf0" stroke-width="1.5" stroke-linejoin="round"><tspan x="150" dy="0">a = (v − v₀) / t</tspan><tspan x="150" dy="42.5">v₀ = 20 м/с</tspan><tspan x="150" dy="42.5">v = 5 м/с,  t = 3 с</tspan></text>
  <rect x="126" y="965" width="660" height="108" rx="18" transform="rotate(-1 456 1019)" fill="#fffaf0" opacity="0.9"/>
  <text transform="rotate(0 150 1024)" x="150" y="1024" font-family="Consolas, JetBrains Mono, monospace" font-size="35" font-weight="900" fill="#211f1b" paint-order="stroke fill" stroke="#fffaf0" stroke-width="3" stroke-linejoin="round"><tspan x="150" dy="0">a = (5 − 20) / 3 = −5 м/с²</tspan></text>
  <path d="M 150 1048 C 405 1058, 465 1038, 720 1048" fill="none" stroke="#e05a3b" stroke-width="8" stroke-linecap="round" opacity="0.92"/>

  <text transform="rotate(0 275 1228)" x="275" y="1228" font-family="Segoe UI, Arial, sans-serif" font-size="39" font-weight="950" fill="#e05a3b" paint-order="stroke fill" stroke="#fffaf0" stroke-width="1.5" stroke-linejoin="round"><tspan x="275" dy="0">минус значит:</tspan></text>
  <text transform="rotate(0 275 1292)" x="275" y="1292" font-family="Segoe UI, Arial, sans-serif" font-size="35" font-weight="900" fill="#e05a3b" paint-order="stroke fill" stroke="#fffaf0" stroke-width="1.5" stroke-linejoin="round"><tspan x="275" dy="0">ускорение направлено</tspan><tspan x="275" dy="40.25">против выбранной оси</tspan></text>
  <text transform="rotate(0 275 1415)" x="275" y="1415" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="820" fill="#211f1b" paint-order="stroke fill" stroke="#fffaf0" stroke-width="1.5" stroke-linejoin="round"><tspan x="275" dy="0">запомни:</tspan><tspan x="275" dy="36.18">• знак зависит от оси</tspan><tspan x="275" dy="36.18">• сначала рисуй направление</tspan></text>
</svg>