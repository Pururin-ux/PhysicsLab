<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
    <text x="118" y="135" transform="rotate(0 118 135)" font-family="Arial Black, sans-serif" font-size="61" font-weight="950" letter-spacing="0" fill="#161412" opacity="1" paint-order="stroke fill" stroke="#f6ead8" stroke-width="4" stroke-linejoin="round"><tspan x="118" dy="0">5 ФОРМУЛ</tspan><tspan x="118" dy="67.10000000000001">КИНЕМАТИКИ</tspan></text>
    <rect x="150" y="275" width="472" height="52" rx="12" transform="rotate(-1 386 301)" fill="#d8d3e9" opacity="0.78" stroke="none" stroke-width="0"/>
    <text x="170" y="312" transform="rotate(0 170 312)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="29" font-weight="900" letter-spacing="0" fill="#174bb2" opacity="1" paint-order="stroke fill" stroke="#f6ead8" stroke-width="1.5" stroke-linejoin="round"><tspan x="170" dy="0">равноускоренное движение</tspan></text>
    <rect x="134" y="398" width="368" height="106" rx="14" transform="rotate(0 318 451)" fill="#fff8eb" opacity="0.72" stroke="none" stroke-width="0"/><text x="148" y="442" transform="rotate(0 148 442)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="25" font-weight="950" letter-spacing="0" fill="#d33128" opacity="1" paint-order="stroke fill" stroke="#fff8eb" stroke-width="1.5" stroke-linejoin="round"><tspan x="148" dy="0">скорость</tspan></text><text x="148" y="485" transform="rotate(0 148 485)" font-family="Consolas, JetBrains Mono, monospace" font-size="30" font-weight="850" letter-spacing="0" fill="#161412" opacity="1" paint-order="stroke fill" stroke="#fff8eb" stroke-width="2" stroke-linejoin="round"><tspan x="148" dy="0">v = v₀ + at</tspan></text>
    <rect x="551" y="398" width="368" height="106" rx="14" transform="rotate(0 735 451)" fill="#fff8eb" opacity="0.72" stroke="none" stroke-width="0"/><text x="565" y="442" transform="rotate(0 565 442)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="25" font-weight="950" letter-spacing="0" fill="#174bb2" opacity="1" paint-order="stroke fill" stroke="#fff8eb" stroke-width="1.5" stroke-linejoin="round"><tspan x="565" dy="0">путь</tspan></text><text x="565" y="485" transform="rotate(0 565 485)" font-family="Consolas, JetBrains Mono, monospace" font-size="30" font-weight="850" letter-spacing="0" fill="#161412" opacity="1" paint-order="stroke fill" stroke="#fff8eb" stroke-width="2" stroke-linejoin="round"><tspan x="565" dy="0">s = v₀t + at²/2</tspan></text>
    <rect x="134" y="573" width="368" height="106" rx="14" transform="rotate(0 318 626)" fill="#fff8eb" opacity="0.72" stroke="none" stroke-width="0"/><text x="148" y="617" transform="rotate(0 148 617)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="25" font-weight="950" letter-spacing="0" fill="#7160b5" opacity="1" paint-order="stroke fill" stroke="#fff8eb" stroke-width="1.5" stroke-linejoin="round"><tspan x="148" dy="0">без времени</tspan></text><text x="148" y="660" transform="rotate(0 148 660)" font-family="Consolas, JetBrains Mono, monospace" font-size="30" font-weight="850" letter-spacing="0" fill="#161412" opacity="1" paint-order="stroke fill" stroke="#fff8eb" stroke-width="2" stroke-linejoin="round"><tspan x="148" dy="0">v² − v₀² = 2as</tspan></text>
    <rect x="551" y="573" width="368" height="106" rx="14" transform="rotate(0 735 626)" fill="#fff8eb" opacity="0.72" stroke="none" stroke-width="0"/><text x="565" y="617" transform="rotate(0 565 617)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="25" font-weight="950" letter-spacing="0" fill="#d33128" opacity="1" paint-order="stroke fill" stroke="#fff8eb" stroke-width="1.5" stroke-linejoin="round"><tspan x="565" dy="0">средняя v</tspan></text><text x="565" y="660" transform="rotate(0 565 660)" font-family="Consolas, JetBrains Mono, monospace" font-size="30" font-weight="850" letter-spacing="0" fill="#161412" opacity="1" paint-order="stroke fill" stroke="#fff8eb" stroke-width="2" stroke-linejoin="round"><tspan x="565" dy="0">s = (v + v₀)t/2</tspan></text>
    <rect x="134" y="748" width="368" height="106" rx="14" transform="rotate(0 318 801)" fill="#fff8eb" opacity="0.72" stroke="none" stroke-width="0"/><text x="148" y="792" transform="rotate(0 148 792)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="25" font-weight="950" letter-spacing="0" fill="#161412" opacity="1" paint-order="stroke fill" stroke="#fff8eb" stroke-width="1.5" stroke-linejoin="round"><tspan x="148" dy="0">ускорение</tspan></text><text x="148" y="835" transform="rotate(0 148 835)" font-family="Consolas, JetBrains Mono, monospace" font-size="30" font-weight="850" letter-spacing="0" fill="#161412" opacity="1" paint-order="stroke fill" stroke="#fff8eb" stroke-width="2" stroke-linejoin="round"><tspan x="148" dy="0">a = (v − v₀)/t</tspan></text>
    <rect x="128" y="1034" width="520" height="146" rx="16" transform="rotate(-1 388 1107)" fill="#fff8eb" opacity="0.76" stroke="none" stroke-width="0"/>
    <text x="150" y="1088" transform="rotate(0 150 1088)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="31" font-weight="850" letter-spacing="0" fill="#161412" opacity="1" paint-order="stroke fill" stroke="#f6ead8" stroke-width="2" stroke-linejoin="round"><tspan x="150" dy="0">ловушка:</tspan><tspan x="150" dy="36.58">v₀ — начальная скорость,</tspan><tspan x="150" dy="36.58">а не первая v из условия</tspan></text>
    <text x="660" y="1220" transform="rotate(-5 660 1220)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="900" letter-spacing="0" fill="#174bb2" opacity="1" paint-order="stroke fill" stroke="#f6ead8" stroke-width="2" stroke-linejoin="round"><tspan x="660" dy="0">сначала ось</tspan></text>
  </svg>