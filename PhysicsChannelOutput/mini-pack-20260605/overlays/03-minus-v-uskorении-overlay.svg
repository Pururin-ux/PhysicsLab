<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
    <text x="100" y="155" transform="rotate(0 100 155)" font-family="Consolas, JetBrains Mono, monospace" font-size="66" font-weight="950" letter-spacing="2" fill="#e9dff9" opacity="1" paint-order="stroke fill" stroke="#101522" stroke-width="5" stroke-linejoin="round"><tspan x="100" dy="0">МИНУС В</tspan><tspan x="100" dy="72.60000000000001">УСКОРЕНИИ</tspan></text>
    <rect x="112" y="325" width="690" height="70" rx="10" transform="rotate(-1 457 360)" fill="#f0e6d8" opacity="0.94" stroke="none" stroke-width="0"/>
    <text x="136" y="373" transform="rotate(0 136 373)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="28" font-weight="800" letter-spacing="0" fill="#161412" opacity="1" paint-order="stroke fill" stroke="#f0e6d8" stroke-width="1" stroke-linejoin="round"><tspan x="136" dy="0">это направление, а не «плохая физика»</tspan></text>
    <text x="178" y="600" transform="rotate(0 178 600)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="37" font-weight="900" letter-spacing="0" fill="#7160b5" opacity="1" paint-order="stroke fill" stroke="#efe4d4" stroke-width="2" stroke-linejoin="round"><tspan x="178" dy="0">сначала выбери ось</tspan></text>
    <text x="188" y="710" transform="rotate(0 188 710)" font-family="Consolas, JetBrains Mono, monospace" font-size="34" font-weight="850" letter-spacing="0" fill="#161412" opacity="1" paint-order="stroke fill" stroke="#efe4d4" stroke-width="2.4" stroke-linejoin="round"><tspan x="188" dy="0">a = (v − v₀) / t</tspan><tspan x="188" dy="45.22">v₀ = 20 м/с</tspan><tspan x="188" dy="45.22">v = 5 м/с,  t = 3 с</tspan><tspan x="188" dy="45.22">a = −5 м/с²</tspan></text>
    <text x="220" y="1045" transform="rotate(0 220 1045)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="36" font-weight="900" letter-spacing="0" fill="#f6e8ff" opacity="1" paint-order="stroke fill" stroke="#231b2d" stroke-width="4" stroke-linejoin="round"><tspan x="220" dy="0">минус значит:</tspan><tspan x="220" dy="41.4">ускорение против оси</tspan></text>
    <text x="245" y="1260" transform="rotate(-3 245 1260)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="30" font-weight="900" letter-spacing="0" fill="#ffd7e8" opacity="1" paint-order="stroke fill" stroke="#171827" stroke-width="3" stroke-linejoin="round"><tspan x="245" dy="0">знак = смысл, не декор</tspan></text>
  </svg>