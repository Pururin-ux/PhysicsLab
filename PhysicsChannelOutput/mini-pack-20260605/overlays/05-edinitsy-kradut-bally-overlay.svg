    <text x="160" y="560" transform="rotate(0 160 560)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="34" font-weight="900" letter-spacing="0" fill="#d33128" opacity="1" paint-order="stroke fill" stroke="#fff7ea" stroke-width="2" stroke-linejoin="round"><tspan x="160" dy="0">перед формулой переведи:</tspan></text>
    <text x="162" y="650" transform="rotate(0 162 650)" font-family="Consolas, JetBrains Mono, monospace" font-size="40" font-weight="900" letter-spacing="0" fill="#161412" opacity="1" paint-order="stroke fill" stroke="#fff7ea" stroke-width="2.5" stroke-linejoin="round"><tspan x="162" dy="0">72 км/ч = 20 м/с</tspan><tspan x="162" dy="54">5 мин = 300 с</tspan><tspan x="162" dy="54">40 см = 0,40 м</tspan></text>
    <text x="124" y="1030" transform="rotate(0 124 1030)" font-family="Segoe Print, Comic Sans MS, cursive" font-size="32" font-weight="850" letter-spacing="0" fill="#161412" opacity="1" paint-order="stroke fill" stroke="#fff7ea" stroke-width="2" stroke-linejoin="round"><tspan x="124" dy="0">чек:</tspan><tspan x="124" dy="40">скорость — м/с</tspan><tspan x="124" dy="40">время — с</tspan><tspan x="124" dy="40">длина — м</tspan></text>
